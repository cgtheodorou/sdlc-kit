name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: claude
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/cgtheodorou/sdlc-kit.git
          plugins: sdlc@sdlc-kit
          # PRs opened by @claude get reviewed too; forks are already excluded above.
          allowed_bots: claude[bot]
          prompt: /sdlc:review ${{ github.event.pull_request.number }} --comment
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git merge-base:*),Bash(git show:*),Bash(git ls-files:*)"

      # Private repos only: the transcript can quote repository content.
      - if: always() && github.event.repository.private && steps.claude.outputs.execution_file
        uses: actions/upload-artifact@v7
        with:
          name: claude-transcript-review-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14
